{% extends "base.html" %}

{% block title %}{{ day.title }}{% endblock %}

{% block content %}
<a href="{{ url_for('calendar.index') }}" role="button" class="outline secondary back-link">&larr; Back</a>

{% if locked %}
  <article class="locked-day">
    <h1>{{ day.title }}</h1>
    <p>&#128274; This day unlocks at <strong>{{ day.unlock_at.strftime('%Y-%m-%d %H:%M %Z') }}</strong>.</p>
  </article>
{% else %}
  <h1>{{ day.title }}</h1>
  <div class="pair">
    <img class="photo" src="{{ url_for('static', filename='images/' + day.photo) }}" alt="{{ day.title }} photo">
    <img class="note" src="{{ url_for('static', filename='images/' + day.note) }}" alt="{{ day.title }} note">
  </div>
{% endif %}
{% endblock %}
